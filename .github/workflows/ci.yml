name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_gpu:
        description: Run GPU correctness on the configured self-hosted RTX runner
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  cpu-correctness:
    name: CPU-only correctness (GitHub-hosted)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install explicitly CPU-only PyTorch
        run: |
          uv venv --python 3.12 .venv-cpu
          uv pip install --python .venv-cpu/bin/python torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          uv pip install --python .venv-cpu/bin/python -e . --group dev
      - name: Assert CPU wheel and run CPU tests only
        run: |
          .venv-cpu/bin/python -c 'import torch; assert not torch.cuda.is_available(); assert torch.version.cuda is None'
          .venv-cpu/bin/python -m pytest -q -m "not gpu"

  gpu-correctness:
    name: CUDA correctness (self-hosted, opt-in)
    if: github.event_name == 'workflow_dispatch' && inputs.run_gpu
    runs-on: [self-hosted, linux, x64, gpu, rtx4060]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install locked CUDA stack (JAX remains separate)
        run: uv sync --frozen --extra bench --group dev --no-group jax
      - name: Require actual CUDA hardware
        run: |
          .venv/bin/python -c 'import torch; assert torch.cuda.is_available(); print(torch.cuda.get_device_name(0))'
          nvidia-smi
      - name: Run GPU-marked parity tests
        run: .venv/bin/python -m pytest -q -m gpu
